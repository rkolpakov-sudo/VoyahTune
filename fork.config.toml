# fork.config.toml — встроенная на CI конфигурация форка
# Заполняется по мере WP0/WP1. Значения product/distribution из SPEC (D4, D13).

[product]
name = "VoyahTune"
base_version = "3.22.0"
platform = "H97X/H97C"          # SE/Sport+ 2025-2026 ОД РФ, Android 11
package_names_unchanged = true  # D4

[distribution]
version_scheme = "4.x.y+build.N"  # IMP-11
# Наш endpoint раздачи (GitHub Releases этого репозитория; тег = v<version>).
# {version} подставляется make_release.sh при генерации payload_<version>.json;
# на CI переопределяется переменной PAYLOAD_RELEASE_URL.
releases_url_template = "https://github.com/rkolpakov-sudo/VoyahTune/releases/download/v{version}/payload_{version}.zip"

[vehicle]
# D13: ПИ «не подтверждена»; семантику CAN не менять (только верификация трассами)
can_interfaces = ["TX57", "TX58", "TX77"]
stable_ids = [545, 722, 782, 1196]

[base]
source = "https://storage.yandexcloud.net/voyahtune/v3.22.0/payload_3.22.0.zip"
sha256 = "f309156c836e8533f9770cf1555272e7383fe3b20fb289a364f0ccfd9056dcf1"
size = 124691762
revision = "62b74765a826375fe24b9bde207886011b7d1645"
manifest_schema = 4
artifacts = 29

[components]
# Заполняется по результатам инвентаризации WP0 (payload/manifest.json)

[signing]
# Наш ключ (сгенерирован при regen keystore; JKS + пароли — только в GitHub Secrets, IMP-23).
# Фактические параметры: PKCS12, RSA 3072, SHA256withRSA, validity 10000 дней.
alias = "voyahtune"
algorithm = "RSA 3072"
sha256_fingerprint = "21:2C:C2:BC:A7:F7:A7:75:17:84:F2:10:C7:C7:7B:02:D0:CC:D6:2C:F7:BF:68:92:13:38:43:08:8E:48:87:B8"
owner = "CN=VoyahTune, OU=VoyahTune, O=VoyahTune, L=Unknown, ST=Unknown, C=RU"
# Для детектора WP6: отпечаток наш (не original-fingerprint) = форк -> обновление
