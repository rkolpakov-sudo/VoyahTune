name: CI

on:
  push:
    branches: [main, "wp*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PAYLOAD_SHA256: f309156c836e8533f9770cf1555272e7383fe3b20fb289a364f0ccfd9056dcf1
  PAYLOAD_URL: https://storage.yandexcloud.net/voyahtune/v3.22.0/payload_3.22.0.zip

jobs:
  # G-1: база истины — payload верифицируется против payload/manifest.json (WP0)
  payload-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: payload-cache
          key: payload-3.22.0-${{ env.PAYLOAD_SHA256 }}
      - name: Download & verify payload
        run: |
          mkdir -p payload-cache
          if [ ! -f payload-cache/payload.zip ]; then
            curl -sS -L -o payload-cache/payload.zip "$PAYLOAD_URL"
          fi
          echo "$PAYLOAD_SHA256  payload-cache/payload.zip" | sha256sum -c -
          rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
          unzip -q payload-cache/payload.zip -d /tmp/unpacked
          python3 Utils/verify_payload.py /tmp/unpacked

  # G-2: P0 — сеть в контуре авто запрещена (SPEC L188 / IMP-23); блокирующий
  network-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: network-audit (blocking)
        run: bash scripts/network-audit.sh

  # G-3: reference-map покрытие >= 80% (SPEC L93) из закоммиченного docs/reference-map.json
  reference-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: coverage gate
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("docs/reference-map.json", encoding="utf-8"))
          cov = m.get("coverage_percent", 0)
          print(f"coverage_percent={cov}")
          sys.exit(0 if cov >= 80 else 1)
          PY

  # G-4 (L103): job tests — JVM (HIL + Native unit + позже легендные 303+105),
  # shellcheck, detachment-audit; TODO: Rust 40 (Шаг 1.4), Svelte check (GUI/WP2)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Android SDK (platform 35)
        run: |
          set -euo pipefail
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for base in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                        /usr/local/lib/android/sdk /usr/lib/android-sdk; do
              if [ -n "$base" ] && [ -x "$base/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMGR="$base/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          [ -n "$SDKMGR" ] || { echo "sdkmanager not found" >&2; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35"
      - name: JVM tests (HIL scenarios + Native unit/Robolectric)
        run: ./gradlew :tests:hil:test :Native:app:testDebugUnitTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/hil/build/test-results/**
            tests/hil/build/hil-results/**
            Native/app/build/test-results/**
          if-no-files-found: ignore
      - name: shellcheck payload scripts
        continue-on-error: true   # TODO(WP1): flip once scripts are cleaned
        run: |
          shellcheck -S warning Packaging/payload-common/*.sh Packaging/payload-common/load.bin || true
          shellcheck -S error make_release.sh Utils/*.sh scripts/*.sh 2>/dev/null || true
      - name: detachment-audit (report until WP4)
        continue-on-error: true   # TODO(WP4): flip to blocking (L131)
        run: bash scripts/detachment-audit.sh report

  # G-5 (L103 Шаг 1.3): job payload — сборка payload + SHA256SUMS + BUILD-INFO.
  # APK подписываются secrets (IMP-23); при их отсутствии (PR из форка) собираются unsigned
  # и make_release.sh лишь предупреждает. Блобы берутся из нашего ре-хоста blobs-v1 и
  # верифицируются по blobs/BLOBS-SHA256.txt (L101).
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Android SDK (platform 35)
        run: |
          set -euo pipefail
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for base in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                        /usr/local/lib/android/sdk /usr/lib/android-sdk; do
              if [ -n "$base" ] && [ -x "$base/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMGR="$base/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          [ -n "$SDKMGR" ] || { echo "sdkmanager not found" >&2; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35"
      - name: Cache blobs (rehost blobs-v1)
        uses: actions/cache@v4
        with:
          path: blobs
          key: blobs-${{ hashFiles('blobs/BLOBS-SHA256.txt') }}
      - name: Build payload (make_release.sh --payload)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./make_release.sh "4.0.0-build.${{ github.run_number }}" --payload
      - name: Verify SHA256SUMS
        run: cd Releases/dist && sha256sum -c SHA256SUMS
      - name: Upload payload dist
        uses: actions/upload-artifact@v4
        with:
          name: payload-dist
          path: Releases/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # TODO(L103 Шаг 1.4): job gui-win (windows-latest), job gui-mac (macos-latest)
