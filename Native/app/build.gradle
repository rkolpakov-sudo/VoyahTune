import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def keystoreB64 = System.getenv("ANDROID_KEYSTORE_B64")
def hasReleaseKeys = keystoreB64 != null && !keystoreB64.isEmpty()

android {
    namespace 'ru.big.town.anative'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.big.town.anative'
        minSdk 30
        targetSdk 35
        versionCode 3022000
        versionName '3.22.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseKeys) {
            release {
                def ksFile = file("${buildDir}/release.jks")
                ksFile.parentFile.mkdirs()
                ksFile.bytes = Base64.decoder.decode(keystoreB64)
                storeFile ksFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKeys) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        // См. RestoreMode: восстановленные ресурсы зависимостей не должны блокировать
        // release-сборку (lintVitalRelease).
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation files('lib/android.car.jar')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.constraintlayout:constraintlayout-core:1.1.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.fragment:fragment:1.5.4'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.media:media:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.transition:transition:1.5.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.emoji2:emoji2:1.3.0'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation project(':tests:hil')
    testImplementation 'org.robolectric:robolectric:4.15.1'
}

// Release identity внутри подписанного APK (SPEC L102; порт reference VoyahBuildIdentity).
// assets/voyahtune-build.json читает Installer (release-core payload.rs): recipeSha256
// должен байт-в-байт совпасть с канонической сериализацией recipe из манифеста payload,
// runtimeHashes — с sha256 артефактов релиза. make_release.sh передаёт -Pvoyah* свойства;
// без них (dev-сборка) recipeSha256=null, runtimeHashes={} — такую сборку verify не пропускает.
abstract class VoyahBuildIdentity extends DefaultTask {
    @Input
    abstract Property<String> getReleaseVersion()
    @Input
    abstract Property<String> getRevision()
    @Input
    abstract Property<String> getComponent()
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getRecipeFiles()
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getRuntimeFiles()
    @Input
    abstract MapProperty<String, String> getRuntimeAliases()
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def dir = outputDirectory.get().asFile
        dir.mkdirs()
        def hashes = new TreeMap<String, String>()
        runtimeFiles.files.each { source ->
            def name = runtimeAliases.get()[source.canonicalPath] ?: source.name
            hashes[name] = MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        }
        def recipeFile = recipeFiles.files.size() == 1 ? recipeFiles.files.first() : null
        def body = [
            schema         : 3,
            product        : 'VoyahTune',
            component      : component.get(),
            releaseVersion : releaseVersion.get(),
            buildRevision  : revision.get(),
            recipeSha256   : recipeFile == null ? null
                    : MessageDigest.getInstance('SHA-256').digest(recipeFile.bytes).encodeHex().toString(),
            runtimeHashes  : hashes,
        ]
        new File(dir, 'voyahtune-build.json').text =
                groovy.json.JsonOutput.toJson(body) + '\n'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def repoRoot = rootProject.projectDir
        def identityComponent = android.namespace
        def identity = tasks.register("generate${variant.name.capitalize()}VoyahIdentity", VoyahBuildIdentity) { task ->
            task.releaseVersion.set(providers.gradleProperty('voyahReleaseVersion').orElse('0.0.0-dev'))
            task.revision.set(providers.gradleProperty('voyahBuildRevision').orElse('local'))
            task.component.set(identityComponent)
            task.runtimeAliases.convention([:])
            def recipePath = providers.gradleProperty('voyahInstallRecipe').orNull
            if (recipePath != null) {
                def recipeFile = file(recipePath)
                task.recipeFiles.from(recipeFile)
                def recipe = new groovy.json.JsonSlurper().parse(recipeFile) as Map
                def sources = new groovy.json.JsonSlurper().parse(
                        file(providers.gradleProperty('voyahReleaseSources').get())) as Map
                recipe['files'].findAll { it['artifact'] != 'native.apk' }.each { operation ->
                    def entry = (sources['artifacts'] as List).find { it['name'] == operation['artifact'] }
                    if (entry == null) {
                        throw new GradleException(
                                "voyahReleaseSources: нет источника для ${operation['artifact']}")
                    }
                    def runtimeSource = new File(repoRoot, entry['source'] as String)
                    task.runtimeFiles.from(runtimeSource)
                    task.runtimeAliases.put(runtimeSource.canonicalPath, operation['artifact'] as String)
                }
            }
            task.outputDirectory.set(layout.buildDirectory.dir("generated/voyahIdentity/${variant.name}"))
        }
        variant.sources.assets?.addGeneratedSourceDirectory(identity, { it.outputDirectory })
    }
}
